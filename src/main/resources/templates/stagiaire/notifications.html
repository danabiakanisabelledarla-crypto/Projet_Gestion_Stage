<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Notifications - Stagiaire</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin-layout.css}">
    <link rel="stylesheet" th:href="@{/css/stagiaire-premium.css}">
</head>
<body class="intern-portal">
<div th:replace="~{fragments/sidebar-stagiaire :: sidebar}"></div>
<div class="intern-content-shell">
    <div th:replace="~{fragments/header-stagiaire :: header}"></div>
    <main class="intern-page">
        <section class="intern-page-heading">
            <div class="intern-heading-main">
                <div class="intern-heading-icon"><i class="fa-regular fa-bell"></i></div>
                <div class="intern-heading-copy">
                    <div class="intern-breadcrumb"><a th:href="@{/stagiaire/dashboard}">Accueil</a> / Stagiaire / Notifications</div>
                    <h1>Notifications</h1>
                    <p>Retrouvez les informations envoyées au sujet de votre stage.</p>
                </div>
            </div>
        </section>

        <section class="intern-card">
            <div class="intern-card-header">
                <div>
                    <h2 class="intern-card-title">Activité récente</h2>
                    <p class="intern-card-subtitle">Notifications classées de la plus récente à la plus ancienne.</p>
                </div>
                <span class="intern-status status-blue"
                      th:text="${#lists.size(notifications.?[statut != 'lue'])} + ' non lue(s)'">0 non lue(s)</span>
            </div>
            <div class="intern-feed">
                <div th:each="notification : ${notifications}" class="intern-feed-item">
                    <span class="intern-feed-icon tone-blue"><i class="fa-regular fa-bell"></i></span>
                    <div>
                        <strong th:text="${notification.objet}">Notification</strong>
                        <span th:text="${notification.message}">Message</span>
                        <small th:text="${#temporals.format(notification.dateEnvoi,'dd/MM/yyyy HH:mm')
                                + ' · ' + (notification.statut == 'lue' ? 'Lue' : 'Non lue')}">Date</small>
                    </div>
                </div>
                <div th:if="${#lists.isEmpty(notifications)}" class="intern-empty">Aucune notification.</div>
            </div>
        </section>
    </main>
</div>
</body>
</html>
