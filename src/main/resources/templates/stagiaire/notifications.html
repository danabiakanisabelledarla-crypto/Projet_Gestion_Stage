<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Notifications - Stagiaire</title>
    <link rel="stylesheet" th:href="@{/css/admin-layout.css}">
    <link rel="stylesheet" th:href="@{/css/stagiaire-premium.css}">
    <link rel="stylesheet" th:href="@{/css/workspace-header.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
<div th:replace="~{fragments/sidebar-stagiaire :: sidebar}"></div>
<div class="intern-content-shell">
    <div th:replace="~{fragments/header-stagiaire :: header}"></div>
    <main class="intern-page">
        <section class="intern-page-heading"><div><span class="intern-eyebrow">Espace stagiaire</span>
            <h1>Notifications</h1><p>Retrouvez les informations envoyées au sujet de votre stage.</p></div>
        </section>
        <section class="intern-card">
            <div th:if="${#lists.isEmpty(notifications)}" class="intern-empty">Aucune notification.</div>
            <article th:each="notification : ${notifications}" class="intern-feed-item">
                <span class="intern-feed-icon tone-blue"><i class="fa-regular fa-bell"></i></span>
                <div><strong th:text="${notification.objet}">Notification</strong>
                    <span th:text="${notification.message}">Message</span>
                    <small th:text="${#temporals.format(notification.dateEnvoi,'dd/MM/yyyy HH:mm')}">Date</small>
                </div>
            </article>
        </section>
    </main>
</div>
</body>
</html>
