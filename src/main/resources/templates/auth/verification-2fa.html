<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vérification en deux étapes</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
<main class="login-container" style="display:grid;place-items:center;min-height:100vh;">
    <section class="right-panel" style="width:min(520px,100%);">
        <div class="right-inner">
            <div class="right-header">
                <h2>Vérification en deux étapes</h2>
                <p>Saisissez le code temporaire affiché dans votre application d’authentification.</p>
            </div>
            <div th:if="${erreur}" class="message-erreur" th:text="${erreur}"></div>
            <form th:action="@{/2fa/verification}" method="post" class="login-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="champ-groupe">
                    <input class="champ-input" name="code" inputmode="numeric" pattern="[0-9]{6}"
                           maxlength="6" placeholder="Code à 6 chiffres" required autofocus>
                </div>
                <button type="submit" class="btn-connexion">Vérifier</button>
            </form>
            <form th:action="@{/logout}" method="post" style="margin-top:16px;text-align:center;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" style="border:0;background:none;color:#64748b;cursor:pointer;">Annuler la connexion</button>
            </form>
        </div>
    </section>
</main>
</body>
</html>
