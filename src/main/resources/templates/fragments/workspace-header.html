<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="header"
          th:with="authUser=${#authentication.principal.utilisateur},
                   roleCode=${authUser.role.espaceEffectif},
                   dashboardUrl=${roleCode == 'ADMINISTRATEUR' ? '/admin/dashboard' :
                       (roleCode == 'RESPONSABLE_STAGE' ? '/responsable/dashboard' :
                       (roleCode == 'ENCADREUR' ? '/encadreur/dashboard' : '/stagiaire/dashboard'))},
                   messagesUrl=${roleCode == 'ADMINISTRATEUR' ? '/admin/messages' :
                       (roleCode == 'RESPONSABLE_STAGE' ? '/responsable/messages' :
                       (roleCode == 'ENCADREUR' ? '/encadreur/messagerie' : '/stagiaire/messages'))},
                   profileUrl=${roleCode == 'ADMINISTRATEUR' ? '/profil' :
                       (roleCode == 'RESPONSABLE_STAGE' ? '/responsable/profil' :
                       (roleCode == 'ENCADREUR' ? '/encadreur/profil' : '/stagiaire/profil'))},
                   notificationUrl=${roleCode == 'ADMINISTRATEUR' ? '/admin/notifications' :
                       (roleCode == 'RESPONSABLE_STAGE' ? '/responsable/notifications' :
                       (roleCode == 'ENCADREUR' ? '/encadreur/notifications/page' : '/stagiaire/notifications'))},
                   notificationApiUrl=${roleCode == 'ADMINISTRATEUR' ? '/admin/notifications/api' :
                       (roleCode == 'RESPONSABLE_STAGE' ? '/responsable/notifications/api' :
                       (roleCode == 'ENCADREUR' ? '/encadreur/notifications' : '/stagiaire/notifications/api'))},
                   notificationReadUrl=${roleCode == 'ADMINISTRATEUR' ? '/admin/notifications/lire' :
                       (roleCode == 'RESPONSABLE_STAGE' ? '/responsable/notifications/lire' :
                       (roleCode == 'ENCADREUR' ? '/encadreur/notifications/lire' : '/stagiaire/notifications/lire'))},
                   roleLabel=${roleCode == 'ADMINISTRATEUR' ? 'Administrateur' :
                       (roleCode == 'RESPONSABLE_STAGE' ? 'Responsable' :
                       (roleCode == 'ENCADREUR' ? 'Encadreur' : 'Stagiaire'))}">
    <link rel="stylesheet" th:href="@{/css/workspace-header.css}">

    <header class="intern-header workspace-header" data-workspace-header>
        <a th:href="${dashboardUrl}" class="intern-brand" aria-label="DTA Alliance">
            <img class="intern-brand-logo" th:src="@{/images/logo.png}" src="/images/logo.png"
                 alt="Logo DTA Alliance">
            <span>
                <strong>DTA Alliance</strong>
                <small>Gestion des stages</small>
            </span>
        </a>

        <div class="intern-header-actions">
            <label class="intern-search">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="search" placeholder="Rechercher..." aria-label="Rechercher dans la page">
                <kbd>Ctrl K</kbd>
            </label>

            <button type="button" class="workspace-language-button" title="Français / English"
                    aria-label="Changer la langue">
                <i class="fa-solid fa-language"></i>
                <span>FR</span>
            </button>

            <a th:href="${notificationUrl}" class="intern-icon-button workspace-notification-trigger"
               th:attr="data-notification-api=${notificationApiUrl},data-notification-read=${notificationReadUrl},data-csrf-token=${_csrf.token},data-csrf-header=${_csrf.headerName}"
               title="Notifications" aria-label="Notifications" aria-expanded="false">
                <i class="fa-regular fa-bell"></i>
                <span class="intern-badge" data-notification-count
                      th:text="${notificationsCount ?: 0}"
                      th:classappend="${(notificationsCount ?: 0) == 0 ? ' is-empty' : ''}">0</span>
            </a>
            <div class="workspace-notification-panel" data-notification-panel hidden>
                <div class="workspace-notification-head"><strong>Notifications</strong><a th:href="${notificationUrl}">Tout voir</a></div>
                <div class="workspace-notification-list" data-notification-list><p>Chargement...</p></div>
            </div>

            <a th:href="${messagesUrl}" class="intern-icon-button" title="Messages" aria-label="Messages">
                <i class="fa-regular fa-envelope"></i>
                <span class="intern-badge" th:text="${messagesCount ?: 0}">0</span>
            </a>

            <button type="button" class="intern-profile" data-profile-trigger aria-expanded="false">
                <span class="intern-avatar"
                      th:text="${#strings.substring(authUser.prenom,0,1) + #strings.substring(authUser.nom,0,1)}">DU</span>
                <span class="intern-profile-copy">
                    <strong th:text="${authUser.prenom + ' ' + authUser.nom}">Utilisateur</strong>
                    <small th:text="${roleLabel}">Rôle</small>
                </span>
                <i class="fa-solid fa-chevron-down"></i>
            </button>

            <div class="intern-profile-menu" data-profile-panel>
                <a th:href="${profileUrl}"><i class="fa-regular fa-user"></i> Mon profil</a>
                <a th:href="${messagesUrl}"><i class="fa-regular fa-envelope"></i> Mes messages</a>
                <form th:action="@{/logout}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit">
                        <i class="fa-solid fa-arrow-right-from-bracket"></i> Déconnexion
                    </button>
                </form>
            </div>
        </div>
    </header>

    <script th:src="@{/js/workspace-header.js}"></script>
</th:block>
</body>
</html>
