<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<body>
<aside th:fragment="sidebar" class="barre-laterale portal-sidebar">
    <div class="logo-app">DTA Alliance</div>
    <div class="sidebar-role">Stagiaire</div>

    <nav aria-label="Navigation stagiaire">
        <a th:href="@{/stagiaire/dashboard}" th:classappend="${activePage == 'dashboard'} ? ' actif'">
            <i class="fa-solid fa-gauge-high"></i> Tableau de bord
        </a>
        <a th:href="@{/stagiaire/objectifs}" th:classappend="${activePage == 'objectifs'} ? ' actif'">
            <i class="fa-solid fa-bullseye"></i> Objectifs
        </a>
        <a th:href="@{/stagiaire/taches}" th:classappend="${activePage == 'taches'} ? ' actif'">
            <i class="fa-solid fa-list-check"></i> Mes tâches
        </a>
        <a th:href="@{/stagiaire/journal}" th:classappend="${activePage == 'journal'} ? ' actif'">
            <i class="fa-solid fa-book"></i> Journal
        </a>
        <a th:href="@{/stagiaire/livrables}" th:classappend="${activePage == 'livrables'} ? ' actif'">
            <i class="fa-solid fa-file-arrow-up"></i> Livrables
        </a>
        <a th:href="@{/stagiaire/rapport}" th:classappend="${activePage == 'rapport'} ? ' actif'">
            <i class="fa-solid fa-file-pdf"></i> Rapport final
        </a>
        <a th:href="@{/stagiaire/planning}" th:classappend="${activePage == 'planning'} ? ' actif'">
            <i class="fa-solid fa-calendar"></i> Planning
        </a>
    </nav>

    <div class="sidebar-user">
        <a th:href="@{/stagiaire/profil}" class="sidebar-user-link">
            <i class="fa-solid fa-user"></i> Mon profil
        </a>
        <form th:action="@{/logout}" method="post" class="logout-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="btn-logout">
                <i class="fa-solid fa-right-from-bracket"></i> Déconnexion
            </button>
        </form>
    </div>
</aside>
</body>
</html>
