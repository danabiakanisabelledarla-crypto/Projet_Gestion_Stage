<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<th:block th:fragment="sidebar">
    <button class="workspace-menu-toggle" type="button" aria-label="Ouvrir le menu" aria-expanded="false">
        <i class="fa-solid fa-bars"></i>
    </button>
    <div class="workspace-sidebar-overlay"></div>
    <aside class="barre-laterale portal-sidebar workspace-sidebar stagiaire-workspace-sidebar">
        <a class="workspace-sidebar-brand" th:href="@{/stagiaire/dashboard}">
            <div class="workspace-sidebar-logo"><img th:src="@{/images/logo.png}" alt="DTA Alliance"></div>
            <div><strong>DTA Stages</strong><span>Gestion des stages</span></div>
        </a>

        <div class="workspace-sidebar-role">
            <span>Espace de travail</span>
            <strong>Stagiaire</strong>
        </div>

        <nav class="workspace-sidebar-nav" aria-label="Navigation stagiaire">
            <span class="workspace-nav-label">Mon stage</span>
            <a th:href="@{/stagiaire/dashboard}" th:classappend="${activePage == 'dashboard'} ? ' actif'">
                <i class="fa-solid fa-table-columns"></i><span>Tableau de bord</span>
            </a>
            <a th:href="@{/stagiaire/objectifs}" th:classappend="${activePage == 'objectifs'} ? ' actif'">
                <i class="fa-solid fa-bullseye"></i><span>Objectifs</span>
            </a>
            <a th:href="@{/stagiaire/taches}" th:classappend="${activePage == 'taches'} ? ' actif'">
                <i class="fa-solid fa-list-check"></i><span>Mes tâches</span>
            </a>
            <a th:href="@{/stagiaire/journal}" th:classappend="${activePage == 'journal'} ? ' actif'">
                <i class="fa-regular fa-book-open"></i><span>Journal de bord</span>
            </a>

            <span class="workspace-nav-label">Documents</span>
            <a th:href="@{/stagiaire/livrables}" th:classappend="${activePage == 'livrables'} ? ' actif'">
                <i class="fa-solid fa-file-arrow-up"></i><span>Livrables</span>
            </a>
            <a th:href="@{/stagiaire/rapport}" th:classappend="${activePage == 'rapport'} ? ' actif'">
                <i class="fa-regular fa-file-lines"></i><span>Rapport final</span>
            </a>

            <span class="workspace-nav-label">Organisation</span>
            <a th:href="@{/stagiaire/planning}" th:classappend="${activePage == 'planning'} ? ' actif'">
                <i class="fa-regular fa-calendar-days"></i><span>Planning</span>
            </a>
            <a th:href="@{/stagiaire/messages}" th:classappend="${activePage == 'messages'} ? ' actif'">
                <i class="fa-regular fa-comments"></i><span>Messagerie</span>
            </a>
            <a th:href="@{/stagiaire/profil}" th:classappend="${activePage == 'profil'} ? ' actif'">
                <i class="fa-regular fa-user"></i><span>Mon profil</span>
            </a>
        </nav>

        <div class="workspace-sidebar-footer">
            <div class="workspace-sidebar-user">
                <div class="workspace-avatar">ST</div>
                <div><strong sec:authentication="name">Stagiaire</strong><span>Compte actif</span></div>
            </div>
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" title="Déconnexion"><i class="fa-solid fa-right-from-bracket"></i></button>
            </form>
        </div>
    </aside>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const button = document.querySelector('.workspace-menu-toggle');
            const sidebar = document.querySelector('.workspace-sidebar');
            const overlay = document.querySelector('.workspace-sidebar-overlay');
            if (!button || !sidebar || !overlay) return;
            const close = () => {
                sidebar.classList.remove('mobile-open');
                overlay.classList.remove('visible');
                button.setAttribute('aria-expanded', 'false');
            };
            button.addEventListener('click', () => {
                const open = sidebar.classList.toggle('mobile-open');
                overlay.classList.toggle('visible', open);
                button.setAttribute('aria-expanded', String(open));
            });
            overlay.addEventListener('click', close);
            sidebar.querySelectorAll('a').forEach(link => link.addEventListener('click', close));
        });
    </script>
<script th:src="@{/js/workspace-language.js(v='20260805-2')}"></script>
</th:block>
</body>
</html>
