<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="header" class="intern-header">
    <a th:href="@{/stagiaire/dashboard}" class="intern-brand" aria-label="DTA Alliance">
        <img class="intern-brand-logo" th:src="@{/images/logo.png}" src="/images/logo.png"
             alt="Logo DTA Alliance">
        <span>
            <strong>DTA Alliance</strong>
            <small>Gestion des stages</small>
        </span>
    </a>

    <div class="intern-header-actions">
        <label class="intern-search">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="search" placeholder="Rechercher..." aria-label="Rechercher dans la page">
            <kbd>Ctrl K</kbd>
        </label>

        <a th:href="@{/stagiaire/messages}" class="intern-icon-button" title="Messages" aria-label="Messages">
            <i class="fa-regular fa-envelope"></i>
            <span class="intern-badge" th:text="${messagesCount ?: 0}">0</span>
        </a>

        <button type="button" class="intern-icon-button" title="Notifications" aria-label="Notifications"
                data-notification-trigger>
            <i class="fa-regular fa-bell"></i>
            <span class="intern-badge" th:text="${notificationsCount ?: 0}">0</span>
        </button>

        <div class="intern-notifications" data-notification-panel>
            <div class="intern-popover-title">
                <strong>Notifications</strong>
                <span th:text="|${notificationsCount ?: 0} nouvelle(s)|">0 nouvelle</span>
            </div>
            <div class="intern-empty-notification" th:if="${#lists.isEmpty(notificationsStagiaire)}">
                <i class="fa-regular fa-bell-slash"></i>
                <span>Aucune notification pour le moment.</span>
            </div>
            <a th:each="notification : ${notificationsStagiaire}"
               th:href="@{/stagiaire/dashboard}">
                <i class="fa-regular fa-bell"></i>
                <span>
                    <strong th:text="${notification.objet}">Notification</strong>
                    <span th:text="${notification.message}">Message</span>
                    <small th:text="${#temporals.format(notification.dateEnvoi, 'dd/MM/yyyy HH:mm')}">Date</small>
                </span>
            </a>
            <form th:if="${(notificationsCount ?: 0) > 0}"
                  th:action="@{/stagiaire/notifications/lire}" method="post"
                  class="intern-notification-read-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit">Tout marquer comme lu</button>
            </form>
        </div>

        <button type="button" class="intern-profile" data-profile-trigger>
            <span class="intern-avatar" th:text="${initiales}">SL</span>
            <span class="intern-profile-copy">
                <strong th:text="${nomComplet}">Sophie Leroy</strong>
                <small>Stagiaire</small>
            </span>
            <i class="fa-solid fa-chevron-down"></i>
        </button>

        <div class="intern-profile-menu" data-profile-panel>
            <a th:href="@{/stagiaire/profil}"><i class="fa-regular fa-user"></i> Mon profil</a>
            <a th:href="@{/stagiaire/messages}"><i class="fa-regular fa-envelope"></i> Mes messages</a>
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit"><i class="fa-solid fa-arrow-right-from-bracket"></i> Deconnexion</button>
            </form>
        </div>
    </div>
</header>

<script th:fragment="header-script">
document.addEventListener('DOMContentLoaded', () => {
    const pairs = [
        ['[data-notification-trigger]', '[data-notification-panel]'],
        ['[data-profile-trigger]', '[data-profile-panel]']
    ];

    pairs.forEach(([triggerSelector, panelSelector]) => {
        const trigger = document.querySelector(triggerSelector);
        const panel = document.querySelector(panelSelector);
        if (!trigger || !panel) return;
        trigger.addEventListener('click', event => {
            event.stopPropagation();
            document.querySelectorAll('.intern-popover-open').forEach(openPanel => {
                if (openPanel !== panel) openPanel.classList.remove('intern-popover-open');
            });
            panel.classList.toggle('intern-popover-open');
        });
    });

    document.addEventListener('click', event => {
        if (!event.target.closest('.intern-notifications, .intern-profile-menu')) {
            document.querySelectorAll('.intern-popover-open')
                .forEach(panel => panel.classList.remove('intern-popover-open'));
        }
    });

    const search = document.querySelector('.intern-search input');
    const normalize = value => (value || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .trim();

    if (search) {
        search.addEventListener('input', () => {
            const query = normalize(search.value);
            document.querySelectorAll(
                '[data-search-item], tbody tr, .intern-card, .kanban-card, .journal-entry'
            ).forEach(candidate => {
                if (candidate.closest('.intern-header')) return;
                candidate.classList.toggle(
                    'intern-search-hidden',
                    Boolean(query) && !normalize(candidate.textContent).includes(query)
                );
            });
        });
    }

    document.addEventListener('keydown', event => {
        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k' && search) {
            event.preventDefault();
            search.focus();
        }
    });
});
</script>
</body>
</html>
