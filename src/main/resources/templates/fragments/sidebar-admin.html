<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<th:block th:fragment="sidebar">
    <button class="workspace-menu-toggle" type="button" aria-label="Ouvrir le menu" aria-expanded="false">
        <i class="fa-solid fa-bars"></i>
    </button>
    <div class="workspace-sidebar-overlay"></div>
    <aside class="barre-laterale portal-sidebar workspace-sidebar admin-workspace-sidebar">
        <a class="workspace-sidebar-brand" th:href="@{/admin/dashboard}">
            <div class="workspace-sidebar-logo">D</div>
            <div><strong>DTA Stages</strong><span>Gestion des stages</span></div>
        </a>

        <div class="workspace-sidebar-role">
            <span>Espace de travail</span>
            <strong>Administrateur</strong>
        </div>

        <nav class="workspace-sidebar-nav" aria-label="Navigation administrateur">
            <span class="workspace-nav-label">Pilotage</span>
            <a th:href="@{/admin/dashboard}" th:classappend="${activePage == 'dashboard'} ? ' actif'">
                <i class="fa-solid fa-table-columns"></i><span>Tableau de bord</span>
            </a>
            <a th:href="@{/admin/demandes}" th:classappend="${activePage == 'demandes'} ? ' actif'">
                <i class="fa-regular fa-file-lines"></i><span>Demandes</span>
            </a>
            <a th:href="@{/admin/stagiaires}" th:classappend="${activePage == 'stagiaires'} ? ' actif'">
                <i class="fa-solid fa-graduation-cap"></i><span>Stagiaires</span>
            </a>
            <a th:href="@{/admin/utilisateurs}" th:classappend="${activePage == 'utilisateurs'} ? ' actif'">
                <i class="fa-solid fa-users"></i><span>Utilisateurs</span>
            </a>

            <span class="workspace-nav-label">Administration</span>
            <a th:href="@{/admin/service}" th:classappend="${activePage == 'services'} ? ' actif'">
                <i class="fa-solid fa-building"></i><span>Services</span>
            </a>
            <a th:href="@{/admin/roles-permissions}" th:classappend="${activePage == 'roles-permissions'} ? ' actif'">
                <i class="fa-solid fa-shield-halved"></i><span>Rôles & permissions</span>
            </a>
            <a th:href="@{/admin/documents}" th:classappend="${activePage == 'documents'} ? ' actif'">
                <i class="fa-regular fa-folder-open"></i><span>Documents</span>
            </a>
            <a th:href="@{/admin/rapports}" th:classappend="${activePage == 'rapports' or activePage == 'statistiques'} ? ' actif'">
                <i class="fa-solid fa-chart-column"></i><span>Rapports</span>
            </a>

            <span class="workspace-nav-label">Système</span>
            <a th:href="@{/admin/messages}" th:classappend="${activePage == 'messages'} ? ' actif'">
                <i class="fa-regular fa-comments"></i><span>Messagerie</span>
            </a>
            <a th:href="@{/admin/notifications}" th:classappend="${activePage == 'notifications'} ? ' actif'">
                <i class="fa-regular fa-bell"></i><span>Notifications</span>
            </a>
            <a th:href="@{/admin/journal}" th:classappend="${activePage == 'journal'} ? ' actif'">
                <i class="fa-solid fa-clock-rotate-left"></i><span>Journal d’activité</span>
            </a>
            <a th:href="@{/admin/parametres}"
               th:classappend="${activePage == 'parametres' or activePage == 'sauvegarde' or activePage == 'securite'} ? ' actif'">
                <i class="fa-solid fa-gear"></i><span>Paramètres</span>
            </a>
        </nav>

        <div class="workspace-sidebar-footer">
            <div class="workspace-sidebar-user">
                <div class="workspace-avatar">AD</div>
                <div><strong sec:authentication="name">Administrateur</strong><span>Compte actif</span></div>
            </div>
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" title="Déconnexion"><i class="fa-solid fa-right-from-bracket"></i></button>
            </form>
        </div>
    </aside>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const button = document.querySelector('.workspace-menu-toggle');
            const sidebar = document.querySelector('.workspace-sidebar');
            const overlay = document.querySelector('.workspace-sidebar-overlay');
            if (!button || !sidebar || !overlay) return;
            const close = () => {
                sidebar.classList.remove('mobile-open');
                overlay.classList.remove('visible');
                button.setAttribute('aria-expanded', 'false');
            };
            button.addEventListener('click', () => {
                const open = sidebar.classList.toggle('mobile-open');
                overlay.classList.toggle('visible', open);
                button.setAttribute('aria-expanded', String(open));
            });
            overlay.addEventListener('click', close);
            sidebar.querySelectorAll('a').forEach(link => link.addEventListener('click', close));
        });
    </script>
</th:block>
</body>
</html>
