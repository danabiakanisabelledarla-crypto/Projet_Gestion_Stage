services:
  gestion-stages:
    build:
      context: .
      dockerfile: Dockerfile
    image: dta-alliance/gestion-stages:latest
    container_name: dta-gestion-stages
    init: true
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: "jdbc:h2:file:/app/data/gestion_stages;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE"
      SPRING_DATASOURCE_USERNAME: "${DB_USERNAME:-sa}"
      SPRING_DATASOURCE_PASSWORD: "${DB_PASSWORD:-}"
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "${JPA_SHOW_SQL:-false}"
      SPRING_H2_CONSOLE_ENABLED: "${H2_CONSOLE_ENABLED:-false}"
      SPRING_MAIL_HOST: "${MAIL_HOST:-smtp.gmail.com}"
      SPRING_MAIL_PORT: "${MAIL_PORT:-587}"
      SPRING_MAIL_USERNAME: "${MAIL_USERNAME:-}"
      SPRING_MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "${MAIL_SMTP_AUTH:-true}"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "${MAIL_STARTTLS_ENABLE:-true}"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED: "${MAIL_STARTTLS_REQUIRED:-true}"
      JAVA_OPTS: "${JAVA_OPTS:--XX:MaxRAMPercentage=75.0 -Dfile.encoding=UTF-8}"
      TZ: "${TZ:-Africa/Douala}"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    restart: unless-stopped
    stop_grace_period: 30s
